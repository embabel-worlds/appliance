# Written by Embabel Me — the "Local files" panel provisions this file; it is rewritten on Apply.
#
# The `files` producer (assistant specs/LOCAL_FILES.md) over the directories the user
# shared, in the two ways they can be shared. Roots are RELATIVE — resolved under the
# world sandbox base; the walk is live on every query.
#
#   local/   document folders, bind-mounted under /local and reached through the
#            world's data/local symlink. Named collections; the Me app's panel.
#   trees/   source trees, bind-mounted at their OWN host path and reached through
#            one data/trees/<name> symlink each (`embabel mount add`). Identity
#            mounting is what makes a git worktree's absolute gitdir pointer resolve.
#
# Both are trusted via filesTrustedRoots in world.yml. An empty trees/ is normal and
# costs nothing — it simply contributes no rows.
- name: worldFiles
  kind: files
  roots: ["local/", "trees/"]
  include: ["**/*"]
  maxFiles: 4000
  contentCapKb: 64

# The DIRECTORIES view over the same walk (emit: directories): one row per contained folder,
# carrying fileCount/sizeBytes aggregated over its DIRECT matching files — folder-level
# questions ("what folders do I have", "which folder has the most files", empty folders)
# are first-class. Same roots, same guardrails.
- name: worldFolders
  kind: files
  emit: directories
  roots: ["local/", "trees/"]
  include: ["**/*"]
  maxFiles: 4000

# CONTENT search over the same walk (emit: search): the anchor keys are free-text TERMS (a
# Concept's value) — one row per file whose content matches, with the matching-lines excerpt.
- name: fileContentSearch
  kind: files
  emit: search
  roots: ["local/", "trees/"]
  include: ["**/*"]
  maxFiles: 4000
  contentCapKb: 64

# CONCEPT search (agentic): the term is expanded into literal probes ("trip logistics" →
# travel/flight/hotel) and a file matching ANY probe is returned — how "files about <idea>"
# works when the idea's words never appear verbatim. Fails open to plain search if no expander.
- name: fileConceptSearch
  kind: files
  emit: search
  agentic: true
  intent: "files on the user's own disk that concern the given idea or topic"
  maxProbes: 5
  roots: ["local/", "trees/"]
  include: ["**/*"]
  maxFiles: 4000
  contentCapKb: 64
