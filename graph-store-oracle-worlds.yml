# The Embabel engine's store on an Oracle Database Free server bundled with the appliance.
# Composed in, beside graph-embabel-worlds.yml, when .env says
#
#   VC_EMBABEL_STORE=oracle
#   GRAPH_EMBABEL_ORACLE_URL=jdbc:oracle:thin:@//graph-oracle:1521/FREEPDB1
#
# which `embabel graph migrate --to oracle` writes. With a URL naming any other server, this file
# is left out and the appliance uses that server instead.
#
# Oracle 23ai Free, so the engine keeps the graph in its property-graph layout (JSON labels and
# properties under a SQL property graph, readable by SQL/PGQ); GRAPH_EMBABEL_ORACLE_LAYOUT=rows
# keeps the engine's own rows instead. The image is large (several GB) and the database wants
# about 2 GB of memory: this is a choice somebody makes, never a default.
#
# THE PASSWORD IS IN secrets.env, never .env: GRAPH_EMBABEL_ORACLE_PASSWORD, generated by the
# migrate verb. The app reads it from there; this server takes it as both the administrator's and
# the application user's password through the wrapper below, because the image reads its own names.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  graph-oracle:
    image: ${GRAPH_ORACLE_IMAGE:-gvenzl/oracle-free:23-faststart}
    logging: *logging
    restart: unless-stopped
    env_file:
      - path: secrets.env
        required: false
    environment:
      - TZ=${TZ:-Etc/UTC}
      - APP_USER=${GRAPH_EMBABEL_ORACLE_USERNAME:-embabel}
    entrypoint: ["sh", "-c", "export ORACLE_PASSWORD=\"$$GRAPH_EMBABEL_ORACLE_PASSWORD\" APP_USER_PASSWORD=\"$$GRAPH_EMBABEL_ORACLE_PASSWORD\"; exec container-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    volumes:
      - embabel_graph_oracle_data:/opt/oracle/oradata

  worlds:
    depends_on:
      graph-oracle:
        condition: service_healthy

volumes:
  embabel_graph_oracle_data:
