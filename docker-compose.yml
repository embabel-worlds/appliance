# Embabel Me — appliance. Everything a developer needs, in one `docker compose up`.
#
#   cp .env.example .env      # put your OPENAI_API_KEY in it
#   docker compose up -d
#   open http://localhost:4242
#
# PULL-ONLY BY DESIGN. Every service here is an `image:` — there is no `build:`
# anywhere, no bind mount of a file next to this one, and no relative path. This file
# and `.env` are the only two things you hold; everything else is an image pull.
#
# Ports bind to 127.0.0.1. Sign-in is a development-grade form login (see README —
# "Who can log in"), so this must not be reachable from the network until that is
# replaced. Change the bind address deliberately, not by habit.

name: embabel-appliance

services:

  # ── The assistant itself ────────────────────────────────────────────────────
  assistant:
    image: ghcr.io/embabel/assistant:${EMBABEL_VERSION:-0.2.0-SNAPSHOT}
    container_name: embabel-assistant
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      # Published to the HOST, not merely exposed on the compose network: code-mode
      # sandbox containers are siblings on the host daemon (see the socket mount
      # below) and reach the tool gateway back through host.docker.internal:4242.
      # Unpublishing this port silently breaks every sandbox tool call.
      # Same port on BOTH sides — see SERVER_PORT below.
      - "127.0.0.1:${ASSISTANT_PORT:-4242}:${ASSISTANT_PORT:-4242}"
    environment:
      # The container port MUST equal the published host port: the code sandbox is
      # handed a tool-gateway URL of host.docker.internal:${server.port}, so a
      # remapped port leaves every code-mode call dialling nothing. Moving the
      # appliance to another port therefore moves both sides together.
      - SERVER_PORT=${ASSISTANT_PORT:-4242}
      # Neo4j on the compose network — the in-container Bolt port, not the 7891
      # host mapping a workstation checkout uses.
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-embabel-assistant}
      # The host-published browser port, for the Neo4j link in the UI: a browser
      # resolves it from outside the compose network.
      - NEO4J_BROWSER_PORT=${NEO4J_BROWSER_PORT:-4243}
      - ASSISTANT_PUBLIC_BASE_URL=${ASSISTANT_PUBLIC_BASE_URL:-http://localhost:4242}
      # At least one of these is required — the assistant cannot answer without a
      # model provider. See .env.example.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Bearer token for the MCP endpoints (/mcp, /sse) and the user it acts as.
      # Open WebUI below authenticates with exactly this token.
      - ASSISTANT_MCP_API_TOKEN=${EMBABEL_MCP_API_TOKEN:-}
      - ASSISTANT_MCP_API_TOKEN_USER=${EMBABEL_MCP_API_TOKEN_USER:-alice}
      # `none` drops document conversion to raw Tika and makes the docling service
      # (a multi-GB image) unnecessary.
      - ASSISTANT_DOC_CONVERTER=${ASSISTANT_DOC_CONVERTER:-docling}
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      # Reported in the usage payload as `packaging`, so we can tell an appliance from a
      # bare jar. It is a constant, not information about you — see PHONE_HOME.md.
      - ASSISTANT_PACKAGING=docker-compose
      # Optional integration credentials, passed through only if set in .env. Each
      # unlocks a capability and is inert when empty — the assistant simply does not
      # offer what it has no credential for. These reach the integration layer, never
      # a prompt: the LLM can invoke a tool that needs a token without seeing it.
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
    volumes:
      # The per-user code sandbox shells out to the docker CLI. Sandbox containers
      # are created on the HOST daemon, as siblings of this container — no
      # docker-in-docker, and no bind mounts from this filesystem into them
      # (files move by `docker cp`), so this socket is the entire coupling.
      #
      # This grants the assistant control of the host Docker daemon, which is
      # root-equivalent on the host. That is inherent to running a code sandbox;
      # it is called out here so it is a decision, not a surprise.
      - /var/run/docker.sock:/var/run/docker.sock
      # Worlds, documents, artifacts, apps — the whole persistent surface.
      - embabel_assistant_data:/data
    extra_hosts:
      # Linux has no host.docker.internal by default; sandbox containers get the
      # same mapping from the app, but the app itself needs it to compose the
      # gateway URL it hands them.
      - "host.docker.internal:host-gateway"

  # ── Knowledge graph ─────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:2026.06-community
    container_name: embabel-appliance-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_BROWSER_PORT:-4243}:7474"   # browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-4244}:7687"      # bolt, for cypher-shell
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-embabel-assistant}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:-2G}
    healthcheck:
      # The assistant's Drivine pool connects during startup; without this gate it
      # races Neo4j's plugin load and the first boot fails on a fresh volume.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-embabel-assistant} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - embabel_appliance_neo4j_data:/data

  # ── Document conversion (PDF/DOCX/PPTX/XLSX → structured markdown) ──────────
  # Large image. Set ASSISTANT_DOC_CONVERTER=none in .env and `--scale docling=0`
  # if you only ever ingest text.
  docling:
    image: quay.io/docling-project/docling-serve
    container_name: embabel-appliance-docling
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_ENABLE_UI=0

  # ── Code sandbox image, pre-pulled ──────────────────────────────────────────
  # Not a running service: a one-shot that exists so `docker compose up` pulls the
  # sandbox image onto the host daemon up front. Without it the first code-mode
  # call in a chat blocks on a multi-GB pull and reads as a hang. The tag MUST
  # match WorldConfig.DEFAULT_SANDBOX_IMAGE — that is the name the app asks the
  # daemon for (overridable per world via `sandboxDockerimage` in its config.yml).
  sandbox-image:
    image: embabel/assistant-sandbox:latest
    container_name: embabel-appliance-sandbox-image
    restart: "no"
    command: ["true"]

  # ── Open WebUI — chat front-end over the assistant's MCP surface ────────────
  # Profile-gated: the assistant ships its own web UI on 4242, so this is for
  # people who want their existing chat client. Turn it on WITHOUT editing this
  # file by putting COMPOSE_PROFILES=openwebui in .env.
  open-webui:
    profiles: ["openwebui"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: embabel-appliance-open-webui
    restart: unless-stopped
    depends_on:
      - assistant
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-4245}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_BASE_URL=${OPEN_WEBUI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENABLE_OLLAMA_API=false
      # Don't download a local sentence-transformers model on first boot — it can
      # stall startup for minutes behind HF rate limits, and Embabel handles
      # documents anyway.
      - RAG_EMBEDDING_ENGINE=openai
      - DEFAULT_MODELS=${OPEN_WEBUI_DEFAULT_MODEL:-gpt-4.1}
      # Stable key so encrypted tool-server credentials survive a container recreate.
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY:-}
      # The assistant as a native (Streamable HTTP) MCP tool server. Reached over
      # the compose network by service name, authenticated with the same bearer
      # token the assistant is configured with above.
      - 'TOOL_SERVER_CONNECTIONS=[{"url":"http://assistant:4242/mcp","path":"","type":"mcp","auth_type":"bearer","key":"${EMBABEL_MCP_API_TOKEN:-}","config":{"enable":true,"access_control":null},"info":{"id":"embabel_assistant","name":"embabel_assistant","description":"Embabel assistant tools"}}]'
    volumes:
      - embabel_appliance_open_webui_data:/app/backend/data

  # ── Metrics ─────────────────────────────────────────────────────────────────
  # Prometheus scrapes the assistant's /actuator/prometheus; Grafana renders it.
  #
  #   open http://localhost:4246        (no login, lands on Surface Health)
  #
  # NO PROFILE, deliberately. These once carried a `metrics` profile so they could be
  # switched off from `.env`, but a compose profile cannot be active by default: it is
  # only on when COMPOSE_PROFILES names it, and this appliance is designed to start with
  # no `.env` at all (`./setup.py` collects everything). The result was documentation
  # promising dashboards on by default and a fresh install silently having none.
  #
  # So they are ordinary services. To turn them off, delete these two services and their
  # volumes below — the same way you would drop any other service. `--scale grafana=0
  # --scale prometheus=0` works for one run, but the next plain `up -d` brings them back.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: embabel-appliance-prometheus
    restart: unless-stopped
    depends_on:
      - assistant
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-4247}:9090"
    configs:
      # Inline content, not a bind mount — see the pull-only note at the top of
      # this file. There is no prometheus.yml on your disk to lose.
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - embabel_appliance_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"

  grafana:
    # Stock Grafana with the Embabel dashboards baked in, because a pull-only
    # appliance has no directory to mount them from. Moves with EMBABEL_VERSION so
    # the dashboards match the metrics the app of that version actually emits.
    image: ghcr.io/embabel/assistant-grafana:${EMBABEL_VERSION:-0.2.0-SNAPSHOT}
    container_name: embabel-appliance-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-4246}:3000"
    environment:
      # No login wall. Consistent with the rest of the appliance, this is safe only
      # because the port binds to 127.0.0.1 — anyone who can reach 4246 is admin.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      # Land on Surface Health instead of an empty home. Path is the baked image
      # layer, not /var/lib/grafana — the volume below would shadow that.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/embabel-dashboards/embabel-overview.json
      - GF_FEATURE_TOGGLES_ENABLE=newDashboardSharingComponent
    volumes:
      # Grafana's own state (annotations, starred dashboards, its sqlite db). The
      # dashboards themselves are in the image, so this holds nothing you authored.
      - embabel_appliance_grafana_data:/var/lib/grafana

configs:
  # The scrape target is the assistant ON THE COMPOSE NETWORK — service name and the
  # in-container port, which SERVER_PORT keeps equal to the published one. A
  # workstation checkout scrapes host.docker.internal instead, because there the app
  # runs on the host; here it does not.
  prometheus_config:
    content: |
      global:
        scrape_interval: 10s
        evaluation_interval: 10s

      scrape_configs:
        - job_name: embabel-assistant
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["assistant:${ASSISTANT_PORT:-4242}"]
              labels:
                application: embabel-assistant

volumes:
  embabel_assistant_data:
  embabel_appliance_neo4j_data:
  embabel_appliance_open_webui_data:
  embabel_appliance_prometheus_data:
  embabel_appliance_grafana_data:
