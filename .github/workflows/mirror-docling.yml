# Mirror docling-serve from quay.io into GHCR.
#
# WHY: a first run pulled from three registries — ours, Docker Hub and quay.io —
# and real users failed on the last one mid-pull of a multi-GB image. Docling is
# MIT-licensed, so we copy it byte for byte (a multi-arch index copy, not a
# rebuild) and pin the version in infra.yml.
#
# INTO embabel-worlds, THE ORG THIS REPO LIVES IN. It used to push to embabel,
# where GITHUB_TOKEN has no rights: those packages are linked to no repository, so
# no repository inherits any, and mirroring a NEW name failed with
# "permission_denied: The requested installation does not exist". A package created
# by this workflow is linked to this repo automatically, so the token keeps working
# without anyone holding a PAT.
#
# Run this when adopting a new upstream version or variant, then bump the default
# in infra.yml. The CPU variant is what the appliance ships: the stock image adds a
# CUDA PyTorch that no compose file here can reach, so it costs ~3GB and buys
# nothing. Mirror `docling-serve` as well only when a GPU path exists to use it.
name: mirror-docling

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to mirror (e.g. v1.29.0)"
        required: true
        default: "v1.29.0"
      variant:
        description: "Which build — the CPU one is what infra.yml defaults to"
        required: true
        type: choice
        default: "docling-serve-cpu"
        options:
          - docling-serve-cpu
          - docling-serve

permissions:
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the multi-arch index
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/embabel-worlds/${{ inputs.variant }}:${{ inputs.version }} \
            quay.io/docling-project/${{ inputs.variant }}:${{ inputs.version }}

      # ANONYMOUSLY. A new GHCR package is created PRIVATE, and an authenticated
      # inspect passes happily against one no user can pull — so the check that
      # matters is the one a stranger's `docker pull` makes. Fails loudly here
      # rather than in somebody's first run.
      - name: Verify an anonymous pull works
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.variant }}:${{ inputs.version }}"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:embabel-worlds/${{ inputs.variant }}:pull" | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/embabel-worlds/${{ inputs.variant }}/manifests/${{ inputs.version }}")
          if [ "$CODE" != "200" ]; then
            echo "::error::$IMAGE is not anonymously pullable (HTTP $CODE)."
            echo "::error::A new package is PRIVATE until someone changes it:"
            echo "::error::https://github.com/orgs/embabel-worlds/packages/container/package/${{ inputs.variant }}"
            exit 1
          fi
          echo "$IMAGE is public and pullable."

