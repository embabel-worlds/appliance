# The in-process graph engine — composed in ONLY when somebody asks for it:
#
#   GRAPH_TYPE=MEMORY in .env
#
# EXPERIMENTAL. The appliance's graph moves INSIDE the app process: no graph
# container at all, the smallest footprint the appliance can have. The engine
# journals every write to a file on the same /data volume that holds the world,
# so the world and its graph are one backup unit and one restore unit.
#
# The same overlay posture as graph-falkordb-*.yml: the default appliance is
# Neo4j and stays byte-identical when this file is absent from the composition.
# Composed in, it reconfigures the app and parks the neo4j service behind a
# profile the composition never activates — no service is added, one is idled.
#
# THE ENGINES DO NOT SHARE DATA. The journal, the Neo4j volume and the FalkorDB
# volume are three separate stores; switching engines is choosing which graph
# you are talking to. Switch back and your old graph is still there.
#
# HONEST LIMITS: the Virtual Cypher surface (views, queries, materialization)
# runs at full conformance on this engine, but subsystems that speak the bolt
# wire protocol directly cannot reach an in-process store yet — chat history
# persistence among them. Durability is the journal's fsync posture:
# VC_MEMORY_FSYNC=everysec (default) bounds loss at about a second of writes;
# =always fsyncs per statement.
services:

  assistant:
    environment:
      # GRAPH_TYPE selects the engine inside the app (MemoryEngineConfiguration
      # in the assistant). DRIVINE_GRAPH_TYPE stays NEO4J because the Drivine
      # layer has no MEMORY member to bind — it boots lazily inert against a
      # host that is never dialed, the same parked stance as this overlay's
      # neo4j service.
      - GRAPH_TYPE=MEMORY
      - DRIVINE_GRAPH_TYPE=NEO4J
      - VC_MEMORY_JOURNAL=/data/graph/memory.journal
      - VC_MEMORY_FSYNC=${VC_MEMORY_FSYNC:-everysec}
    # No graph service to wait for: the graph starts when the app does.
    depends_on: !override []

  # Parked, not removed: assigning a profile the composition never activates keeps
  # the default graph out of this run without editing infra.yml. Its volume — and
  # your Neo4j data — remain exactly where they were.
  neo4j:
    profiles: ["parked-by-memory"]
