# The Embabel engine's store on a Postgres server bundled with the appliance. Composed in, beside
# graph-embabel-me.yml, when .env says
#
#   VC_EMBABEL_STORE=postgres
#   GRAPH_EMBABEL_POSTGRES_URL=jdbc:postgresql://graph-postgres:5432/embabel
#
# which `embabel graph migrate --to postgres` writes. With a URL naming any other server, this
# file is left out and the appliance uses that server instead.
#
# THE PASSWORD IS IN secrets.env, never .env: GRAPH_EMBABEL_POSTGRES_PASSWORD, generated by the
# migrate verb. The app reads it from there like every other secret, and this server takes the
# same value as its own through the one-line wrapper below — Postgres reads POSTGRES_PASSWORD,
# and secrets.env is passed through verbatim, so the name has to be bridged at start.
#
# Its data is a volume of its own, embabel_graph_postgres_data, beside the others: `embabel backup`
# and `down -v` treat it as they treat the rest.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  graph-postgres:
    image: postgres:${GRAPH_POSTGRES_VERSION:-17-alpine}
    logging: *logging
    restart: unless-stopped
    env_file:
      - path: secrets.env
        required: false
    environment:
      - TZ=${TZ:-Etc/UTC}
      - POSTGRES_USER=${GRAPH_EMBABEL_POSTGRES_USERNAME:-embabel}
      - POSTGRES_DB=embabel
    entrypoint: ["sh", "-c", "POSTGRES_PASSWORD=\"$$GRAPH_EMBABEL_POSTGRES_PASSWORD\" exec docker-entrypoint.sh postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d embabel"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes:
      - embabel_graph_postgres_data:/var/lib/postgresql/data

  assistant:
    depends_on:
      graph-postgres:
        condition: service_healthy

volumes:
  embabel_graph_postgres_data:
